# Isolated environment for the run viewer: PyVista (scripts/15_view_pose_pyvista.py, launched by
# scripts/13 and scripts/19). PyVista is kept out of the root project because the root pyproject.toml is a
# Docker/cluster recipe file (a change forces rebuilds).
[project]
name = "viking-splatad-viz"
version = "0.1.0"
description = "PyVista viewer for SplatAD run outputs (read-only)"
requires-python = ">=3.10"
dependencies = [
  "pyvista>=0.43",
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6",
  # The root package supplies the shared helpers (viking_splatad.viz, .eval, .labels).
  "viking_splatad",
]

[tool.uv.sources]
viking_splatad = { path = "..", editable = true }
