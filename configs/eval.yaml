# Evaluation settings shared by every session (read by scripts/13_eval_semantic_occupancy.py).
# Session-specific inputs (GT folder, labels sample) come from configs/sessions/<session>.yaml.
eval:
  # PLAN §5 P1 ungated extraction: a rendered ray gives a point when its accumulation
  # Σw_i = 1 − ∏(1 − α_i) reaches this value. 0.5 = the ray is more likely stopped than not, the
  # same even-odds rule as SplatAD's own ray-drop gate (sigmoid(ray_drop) <= 0.5). P2 occupancy
  # (T57) uses the same value, so P1 and P2 share one opacity cut.
  render_accumulation_threshold: 0.5
  # Classes scored (PLAN §5 "Classes scored"): matched on the labels file's class id, never on
  # the name (labels/cuboids.py DEFAULT_CLASS_NAMES and the file's own names differ).
  scored_class_ids:
    tree_trunk: 1
    bush_or_small_tree: 4
    rock: 3
  # T45 headline threshold n_min per class = this quantile of the real test sweeps' point counts in
  # the class's hit cuboids. The lower quartile is the usual robust floor: three quarters of the
  # objects the real lidar saw got at least this many points, so a rendered object with fewer is
  # weaker than most real observations, without letting the sparsest outliers set the bar.
  n_min_quantile: 0.25
  # Horizontal radius (m) around each sweep's lidar within which scripts/15 draws voxels and boxes.
  # A presentation choice, not a measured value: the user's choice (2026-11-02), wide enough to
  # show several trunks with their surroundings while single voxels stay distinguishable. Override
  # per run with --radius-meters (scripts/15) or --viz-radius-meters (scripts/13).
  viz_radius_meters: 25.0
  # Scored class names scripts/15 draws (a list of names from scored_class_ids); null = all scored
  # classes. Override per run with --classes (scripts/15) or --viz-classes (scripts/13).
  viz_classes: null
