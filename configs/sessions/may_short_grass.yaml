# Session config: May 2024 short-grass run. One file per session keeps May and June
# strictly separate (own paths, own radar extrinsic variant, own labels sample, own output).
session:
  name: may_short_grass
  # Selects the per-run hugin radar variant inside calibration/extrinsics/extrinsics.txt
  # (the file lists "short_grass__ros1__" (2024-05) and "high_grass__ros1__" (2024-06) separately).
  extrinsics_variant: short_grass
  bag_dir: data/raw/may_short_grass/extracted/ros2_jazzy/data/2024_05_short_grass_run/bag/short_grass__ros2
  calibration_dir: data/raw/may_short_grass/extracted/ros2_jazzy/calibration
  labels_json: data/raw/may_short_grass/extracted/ros2_jazzy/cuboid_labels/short_and_tall_grass_labels.json
  # Substring selecting this session's sample (map) in the labels JSON (see reports/may_chunk0_inspection.md).
  labels_sample_key: "2024_05"
  output_dir: data/intermediate/may_short_grass
  gt_dir: data/gt/may_short_grass

# Which bag chunks / time span to convert. Offsets are seconds from the first message of
# the selected chunk files; null means "everything present". The chunk list is explicit so a
# newly downloaded chunk is picked up by adding its file name (or leaving the list null = all
# *.mcap files found in bag_dir, sorted by name index).
window:
  # Scene A (PLAN.md §1): trunks, low grass here; the same gravel path and birch/pine stand as
  # June chunks 20-22 (high grass). Chosen by guess-and-check with scripts/02_scene_quicklook.py
  # (reports/scene_a/). Chunk 9 holds ~25 s standing still (about +27 s to +53 s).
  chunk_files: [short_grass__ros2_7.mcap, short_grass__ros2_8.mcap, short_grass__ros2_9.mcap]
  start_offset_s: null
  end_offset_s: null

topics:
  camera_image: /ids_camera/image_raw/compressed
  camera_info: /ids_camera/image_raw/camera_info
  lidar_raw: /ouster/points
  lidar_deskewed: /point_cloud_deskewed
  radar: /hugin_raf_1/radar_data
  pose: /icp_odom
  tf: /tf

frames:
  base: base_link
  camera: camera
  lidar: os_sensor
  radar: hugin_radar
  map: map

camera:
  name: ids_camera
  # Timestamp convention and readout duration are NOT documented for the IDS uEye. Until measured,
  # readout is 0 which disables SplatAD rolling-shutter compensation (plan: start at 0, then ablate).
  timestamp_convention: center
  readout_seconds: 0.0
  # Undistortion crop: alpha=0 keeps only valid pixels (no black borders), as SplatAD cannot mask them.
  undistort_alpha: 0.0
  # 1.0 = keep full 2056x1542 resolution; SplatAD downscales internally (num_downscales=2).
  resize_factor: 1.0
  jpeg_quality: 95

lidar:
  name: ouster
  # deskewed = dataset's /point_cloud_deskewed (reference time ~ sweep start, inferred in Phase 1);
  # raw_own_deskew = /ouster/points deskewed here with /icp_odom (used as cross-check, see align report).
  source: deskewed
  # Reference time inside the sweep that lidars.times refers to and that points are compensated to.
  reference: start
  # Per-point time field (uint32 nanoseconds from sweep start) and its unit conversion.
  point_time_field: t
  point_time_unit_seconds: 1.0e-9
  range_field: range
  # Ouster range is uint32 millimetres; points with range 0 are no-return.
  range_unit_meters: 1.0e-3
  intensity_field: reflectivity
  # Percentile used to scale intensity to [0,1] (T14); 99 keeps a few bright retro-reflectors from
  # compressing the rest of the range.
  intensity_percentile: 99.0
  ring_field: ring
  # Margin added around the derived robot-body cluster when computing min_lidar_dist (T15), metres.
  ego_margin_m: 0.05
  # Scans pooled to derive the ring set / ego box (T15/T16); every scan is overkill.
  model_derivation_scan_count: 50
  # Beam model (T51): the beam directions of every (ring, column) cell are fitted on the raw cloud
  # of the same sweeps. Used by the no-return sidecar, and its far-field elevations are the
  # manifest's elevation mapping (T61). Gate on the median fit residual, in azimuth columns: below half
  # a column a placeholder still falls in its own raster column.
  beam_fit_max_median_residual_columns: 0.5
  # Residual percentile stored in derived.json for diagnostics (conventional robust max).
  beam_fit_residual_percentile: 99.0

radar:
  name: hugin
  fields: [x, y, z, power, doppler]

split:
  # Fraction of the windowed frames used for training; the rest are test.
  train_fraction: 0.9
  # Test set = this many contiguous time blocks, the same for camera and lidar, centred at
  # k/(K+1) of the run's window (T60; user's choice 2026-10-26: two middle stretches). It
  # replaces neurad's interleaved split, whose test frames sit 0.1 s from a train frame (an
  # interpolation-only check). Each block holds (1 - train_fraction)/K of the window; blocks stay
  # apart only if train_fraction > 1/(K+1). Read by scripts/slurm/submit_run.py
  # (TEST_BLOCK_COUNT -> viking-data --test-block-count).
  test_block_count: 2
  # Only the central half of each test block is the test split, rendered and fetched (T62; user's
  # choice 2026-10-26: test renders only, to cut what is copied back to the Mac). The outer
  # quarters of each block are guard frames: still never trained on (train is unchanged), not
  # rendered. They also put a quarter block of time between test frames and the nearest train frame.
  # Read by scripts/slurm/submit_run.py (TEST_BLOCK_CORE_FRACTION -> viking-data --test-block-core-fraction).
  test_block_core_fraction: 0.5

splatad:
  # Passed to the dataparser config; see plan contract table.
  load_cuboids: false
  # true = append the recorded Ouster no-returns (lidar_no_return/, written by the converter since
  # 2026-10-26) as 2000 m "did not return" rays for the ray-drop loss (T55). Needs a dataset
  # extracted with the sidecar; May, B and R must use the same value. Read by
  # scripts/slurm/submit_run.py (stage refuses a dataset without the sidecar; submit passes it to
  # ns-train as --add-missing-points).
  add_missing_points: true
