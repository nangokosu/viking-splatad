# Slurm submission settings for SplatAD runs on the CS Lab cluster (read by scripts/slurm/submit_run.py).
# Source of the cluster rules: https://support.cs.toronto.edu/systems/slurmresource.html
# No personal information here: the cluster username is taken at runtime from ~/.ssh/config
# (User for this host) or from the VIKING_SLURM_USER environment variable.

# Login node used to submit jobs (comps0-3 are equivalent; never compute there).
ssh_host: comps0.cs.toronto.edu

# The only partition with GPUs (CLAUDE.md "GPU training on Slurm", step 5).
partition: gpunodes
# The probe job saw RTX A6000 = compute capability 8.6 on gpunode2. build_env.sbatch compiles the
# CUDA kernels for the GPU of the node it runs on (nvidia-smi compute_cap), so the environment
# is sm_86-only and every job (build and run) must land on the same GPU type.
# The GPU type used to filter `sinfo` rows is derived from this string (its middle field).
gres: gpu:rtx_a6000:1

# Fraction of the matching node's RAM requested with --mem. "Most of its RAM": the remaining
# 10% is headroom for the OS, the Slurm daemon and the page cache, so the job is not
# OOM-killed or the node marked unhealthy when it asks for every last MB.
mem_fraction: 0.9

# MSCAC workdisk: persistent, non-expiring research space (1.5 TB, NFS from fs3, mounted on the
# login and compute nodes). Each user owns <workdisk_root>/<cluster username>/. Everything the
# project puts on the cluster lives there: code, data, the environment and run outputs.
# Not home: MSCAC home dirs have a 10 GB quota, and a full home made the earlier jobs' writes
# fail (CS Lab support reply, 2026-10-26). Not scratch: it expires every 15 days, and the
# workdisk is exported from the same file servers, so it is as fast.
workdisk_root: /w/20262

# Stage directory, RELATIVE TO <workdisk_root>/<cluster username>/ (resolved to an absolute path
# over ssh at submit time with the remote `id -un`, so no username is stored here). Holds
# code/<sha>/, data/<session>/, envs/ (environments + markers + build logs) and runs/<run_id>/.
stage_root: viking-splatad

# micromamba (user-space conda) used to create the environment. Pinned release and its
# published sha256 (micromamba-linux-64.sha256 of that GitHub release, fetched 2026-10-25);
# build_env.sbatch refuses a binary whose checksum differs.
micromamba_version: 2.9.0-0
micromamba_sha256: 366cd9cd8be14df1ab8ed50352a82111082a36686b2d389fdb79a92c3fafb3e3

# Files whose committed contents define the environment. Their hash names the env directory
# (envs/splatad-<hash>), so a run always uses the env its recipe describes, and changing any of
# them requires a new `build-env`.
environment_recipe_files:
  - docker/Dockerfile.splatad
  - docker/constraints.txt
  - scripts/slurm/cluster_env.yaml
  - scripts/slurm/build_env.sbatch
  - pyproject.toml

env_build:
  # Conservative cap, far under the 5-day limit: the reference image build compiled the same
  # kernels in ~2-3 h under amd64 emulation on a Mac; natively on 24 cores it is expected to be
  # well under that. Refine from sacct Elapsed of the first build.
  time_limit: "0-06:00:00"

# Render-only jobs (submit_run.py render, scripts/slurm/render_only.sbatch): guard frames of a finished
# run, rendered from its checkpoint without training.
render_only:
  # Measured render speeds (running-splatad-render-jobs skill, job 222633): camera ~0.5 s/frame
  # (72-86 s for 150), lidar ~0.5 s/sweep (73 s for 150), plus a few minutes of model and dataset load
  # per render step. A run's whole guard set is a few hundred frames (full May: 217 camera, 216 lidar),
  # so even all of it is ~4 min of rendering. 2 h leaves >10x headroom for slow loads and a busy
  # workdisk while staying short enough to schedule quickly.
  time_limit: "0-02:00:00"

profiles:
  smoke:
    # Goal: shortest run that still tests the dataparser and conversion pipeline, not quality.
    # Time window, in seconds from the earliest sensor timestamp; submit_run.py converts it to
    # the dataparser's --dataset-start/end-fraction from the dataset's own timestamps.
    # Chosen from a 25-frame contact sheet with per-frame speed of may_chunks0_1_smoke
    # (2026-10-25, user asked for a non-forest scene):
    #   * 0-22 s the robot stands still (no parallax, no signal), so the window starts later;
    #   * 38-83 s is the parking lot / building stretch, driven straight at ~0.93 m/s;
    #   * 52-67 s holds a parked car passing close by (frames #531, #607: strong parallax that
    #     exposes pose/timing errors), flat facades with windows (straight edges that expose
    #     intrinsics/distortion errors), a sign and a boulder (#682).
    # 15 s at ~10 Hz is ~150 camera frames and ~150 sweeps over ~14 m, so neighbouring views
    # overlap heavily. The session's 0.9 / 0.1 split would leave ~1 rendered test frame per sensor
    # here, so this profile overrides both (user's choice 2026-10-27; profile_split_fractions):
    window_start_seconds: 52
    window_seconds: 15
    # 80/20: two T60 test blocks of 15 s x (1 - 0.8) / 2 = 1.5 s (~15 frames at ~10 Hz) each.
    # Passed to the dataparser as --train-split-fraction-override (T27).
    train_fraction: 0.8
    # Render the central 20% of each block: 0.2 x 1.5 s = 0.3 s, ~3 frames per block per sensor,
    # ~6 rendered test frames each for camera and lidar; the other 80% of each block is guard.
    test_block_core_fraction: 0.2
    # ~120 training frames (80% of ~150) x ~25 visits each = 3000 iterations (one image per iteration):
    # enough for a recognisable fit, a tenth of SplatAD's stock 30001.
    max_num_iterations: 3000
    # At least 50 whole-stretch evals per run (the user's minimum, 2026-10-26). submit_run.py derives
    # the eval interval k = (N-1)//50 = 59 (T63) and exports it as --steps-per-eval-all-images.
    minimum_eval_points: 50
    # 3000 / 1000 = 3 checkpoints, so a kill mid-run still leaves something to render.
    steps_per_save: 1000
    # ns-train --machine.seed (python/numpy/torch RNGs). 42 = nerfstudio's MachineConfig default,
    # so earlier smoke runs used the same value; set here so every run records it. It does not
    # make training bit-exact (float-atomic gradient sums in gsplat/SplatAD and tcnn backward).
    seed: 42
    # Conservative cap, far under the 5-day limit, for 3k iterations plus loading and the render.
    # Refine from the measured train/render timings in job_info.txt and `sacct` Elapsed.
    time_limit: "0-02:00:00"
    # Render only the held-out views (the T62 cores of the test blocks): they expose wrong geometry
    # that training views can hide by memorising, and training views are not re-rendered, which
    # keeps the data copied back to the Mac small (user's choice 2026-10-26).
    render_pose_source: test
    # Full resolution: only ~150 frames, and pixel-level misalignment is what we look for.
    render_downscale_factor: 1
  may_scene_a:
    # Goal: the full May Scene A model (CLAUDE.md scope: chunks 7-9 of may_short_grass, low grass),
    # trained with stock SplatAD and checked on the held-out T60 blocks.
    # No window_start_seconds / window_seconds: the whole extracted recording (~241 s), since the
    # session config already cuts it to Scene A (start/end fraction 0.0 / 1.0).
    # SplatAD's stock iteration count (method config default), so May matches the published
    # recipe; ~2160 training camera frames x ~14 visits each (one image per iteration).
    max_num_iterations: 30001
    # At least 50 whole-stretch evals per run (the user's minimum, 2026-10-26). submit_run.py derives
    # the eval interval k = (N-1)//50 = 600 (T63) and exports it as --steps-per-eval-all-images.
    minimum_eval_points: 50
    # ~15 checkpoints over the run; at the smoke's 0.22 s/iteration (job 222933: 656 s / 3000)
    # that is one every ~7 min, so a kill at the time limit loses little.
    steps_per_save: 2000
    # Same seed as the smoke and as June B / R, so the three runs differ only in their data/method.
    seed: 42
    # Estimate from job 222933 scaled linearly: train 656 s x 10 = ~1.8 h; camera and lidar renders
    # ~100 s per 150 frames x ~24 test frames each = under a minute. ~2 h total; 6 h leaves ~3x headroom
    # for a larger Gaussian count on a full scene, far under the 5-day limit.
    time_limit: "0-06:00:00"
    # Render only the test frames (the T62 cores of the two T60 held-out blocks), for the held-out
    # metrics in renders/test/lidar_metrics.json and for viewing. Training views are not
    # re-rendered, so far less is copied back to the Mac (user's choice 2026-10-26).
    render_pose_source: test
    # Full resolution, as the smoke: pixel-level misalignment and trunk detail are what we look at.
    render_downscale_factor: 1
  june_scene_a:
    # Goal: June Scene A (chunks 20-22 of june_tall_grass, high grass) trained exactly like
    # may_scene_a: stock SplatAD with lidar + camera (photometric) loss = PLAN §4.3's B+cam, run first
    # by the user's choice (2026-10-26). Lidar-only core B needs a train-lidar-only switch, not yet here.
    # Every value below equals may_scene_a's so the two runs differ only in their data.
    # Whole extracted recording (~216 s): the session config already cuts it to Scene A.
    # SplatAD's stock iteration count, as May; ~1940 training camera frames x ~15 visits each.
    max_num_iterations: 30001
    # At least 50 whole-stretch evals per run (the user's minimum, 2026-10-26). submit_run.py derives
    # the eval interval k = (N-1)//50 = 600 (T63) and exports it as --steps-per-eval-all-images.
    minimum_eval_points: 50
    # As May: ~15 checkpoints, one every ~7 min at ~0.22 s/iteration.
    steps_per_save: 2000
    # Same seed as May (and as the later lidar-only B and R runs).
    seed: 42
    # As May: same iteration count on a slightly smaller recording (2153 vs 2401 camera frames),
    # so May's ~2 h estimate is an upper bound; 6 h leaves ~3x headroom.
    time_limit: "0-06:00:00"
    # As May: render only the T62 test cores (21 camera frames, 22 lidar sweeps for June).
    render_pose_source: test
    # As May: full resolution.
    render_downscale_factor: 1
