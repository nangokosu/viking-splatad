# Slurm submission settings for SplatAD runs on the CS Lab cluster (read by scripts/slurm/submit_run.py).
# Source of the cluster rules: https://support.cs.toronto.edu/systems/slurmresource.html
# No personal information here: the cluster username is taken at runtime from ~/.ssh/config
# (User for this host) or from the VIKING_SLURM_USER environment variable.

# Login node used to submit jobs (comps0-3 are equivalent; never compute there).
ssh_host: comps0.cs.toronto.edu

# The only partition with GPUs (CLAUDE.md "GPU training on Slurm", step 5).
partition: gpunodes
# The probe job saw RTX A6000 = compute capability 8.6 on gpunode2. build_env.sbatch compiles the
# CUDA kernels for the GPU of the node it runs on (nvidia-smi compute_cap), so the environment
# is sm_86-only and every job (build and run) must land on the same GPU type.
# The GPU type used to filter `sinfo` rows is derived from this string (its middle field).
# This is the default for every job and the only GPU for build-env and resume. A profile or
# render_only may override it with its own `gres`, but only with a GPU of the same compute
# capability 8.6, so the sm_86 kernels run unchanged: the RTX A4500 nodes (gpunode15-27, 29, 30)
# report 8.6 (render job on 2026-10-27, job_info.txt gpu_check: NVIDIA RTX A4500 (8, 6)).
gres: gpu:rtx_a6000:1

# Nodes Slurm must never use for any job (sbatch --exclude). gpunode16 (RTX A4500) killed three
# runs at their first training iteration with a CUDA index-out-of-bounds assert in the lidar
# raster step (jobs 224504, 224537, 224538, 2026-10-29), while the identical code and data ran
# on gpunode29. Remove the entry once CS Lab has fixed the node.
excluded_nodes:
  - gpunode16

# Fraction of the matching node's RAM requested with --mem. "Most of its RAM": the remaining
# 10% is headroom for the OS, the Slurm daemon and the page cache, so the job is not
# OOM-killed or the node marked unhealthy when it asks for every last MB.
mem_fraction: 0.9

# MSCAC workdisk: persistent, non-expiring research space (1.5 TB, NFS from fs3, mounted on the
# login and compute nodes). Each user owns <workdisk_root>/<cluster username>/. Everything the
# project puts on the cluster lives there: code, data, the environment and run outputs.
# Not home: MSCAC home dirs have a 10 GB quota, and a full home made the earlier jobs' writes
# fail (CS Lab support reply, 2026-10-26). Not scratch: it expires every 15 days, and the
# workdisk is exported from the same file servers, so it is as fast.
workdisk_root: /w/20262

# Stage directory, RELATIVE TO <workdisk_root>/<cluster username>/ (resolved to an absolute path
# over ssh at submit time with the remote `id -un`, so no username is stored here). Holds
# code/<sha>/, data/<session>/, envs/ (environments + markers + build logs) and runs/<run_id>/.
stage_root: viking-splatad

# micromamba (user-space conda) used to create the environment. Pinned release and its
# published sha256 (micromamba-linux-64.sha256 of that GitHub release, fetched 2026-10-25);
# build_env.sbatch refuses a binary whose checksum differs.
micromamba_version: 2.9.0-0
micromamba_sha256: 366cd9cd8be14df1ab8ed50352a82111082a36686b2d389fdb79a92c3fafb3e3

# Files whose committed contents define the environment. Their hash names the env directory
# (envs/splatad-<hash>), so a run always uses the env its recipe describes, and changing any of
# them requires a new `build-env`.
environment_recipe_files:
  - docker/Dockerfile.splatad
  - docker/constraints.txt
  - scripts/slurm/cluster_env.yaml
  - scripts/slurm/build_env.sbatch
  - pyproject.toml

env_build:
  # Conservative cap, far under the 5-day limit: the reference image build compiled the same
  # kernels in ~2-3 h under amd64 emulation on a Mac; natively on 24 cores it is expected to be
  # well under that. Refine from sacct Elapsed of the first build.
  time_limit: "0-06:00:00"

validation_gpu:
  # Validation-only alternative when A4500s are booked. NVIDIA lists RTX A2000
  # as compute capability 8.6, matching the compiled environment. Never used for
  # optimization; training profiles and their GPU policy remain unchanged.
  gres: gpu:rtx_a2000:1
  # Cached-input full suites measured ~2 min; 15 min leaves room for data checks,
  # GPU initialization and overlay generation without a two-hour queue request.
  time_limit: "0-00:15:00"

validation_cpu:
  # Tests and dataparser overlays do not optimize SplatAD and need no GPU.
  # Reuse the CPU/RAM budget already exercised on render_only nodes, bounded
  # by live CPU-node capacity rather than inventing new resource sizes.
  partition: cpunodes
  resource_source: render_only
  time_limit: "0-00:15:00"

radar_runtime_budget:
  # Allocation headroom only, not a model/loss hyperparameter. The stock full
  # allocation likewise used roughly twice measured training/rendering time.
  headroom_factor: 2.0

# Render-only jobs (submit_run.py render, scripts/slurm/render_only.sbatch): guard frames of a finished
# run, rendered from its checkpoint without training.
render_only:
  # Measured render speeds (running-splatad-render-jobs skill, job 222633): camera ~0.5 s/frame
  # (72-86 s for 150), lidar ~0.5 s/sweep (73 s for 150), plus a few minutes of model and dataset load
  # per render step. A run's whole guard set is a few hundred frames (full May: 217 camera, 216 lidar),
  # so even all of it is ~4 min of rendering. 2 h leaves >10x headroom for slow loads and a busy
  # workdisk while staying short enough to schedule quickly.
  time_limit: "0-02:00:00"
  # RTX A4500 (20 GB, sm_86 like the A6000; see `gres` above), user's choice 2026-10-27: there are
  # ~15 A4500 nodes against 2 A6000 nodes, so render jobs queue less. Rendering with painting off fits:
  # the full May after-training render (22 camera, 24 lidar) finished on an A4500 node in ~9 min
  # within its 27000 MB, sized by submit_run.py from sinfo as for every job.
  gres: gpu:rtx_a4500:1

profiles:
  # The anchor lets smoke_a4500 reuse every smoke setting.
  smoke: &smoke_profile
    # Goal: shortest run that still tests the dataparser and conversion pipeline, not quality.
    # Time window, in seconds from the earliest sensor timestamp; submit_run.py converts it to
    # the dataparser's --dataset-start/end-fraction from the dataset's own timestamps.
    # Chosen from a 25-frame contact sheet with per-frame speed of may_chunks0_1_smoke
    # (2026-10-25, user asked for a non-forest scene):
    #   * 0-22 s the robot stands still (no parallax, no signal), so the window starts later;
    #   * 38-83 s is the parking lot / building stretch, driven straight at ~0.93 m/s;
    #   * 52-67 s holds a parked car passing close by (frames #531, #607: strong parallax that
    #     exposes pose/timing errors), flat facades with windows (straight edges that expose
    #     intrinsics/distortion errors), a sign and a boulder (#682).
    # 15 s at ~10 Hz is ~150 camera frames and ~150 sweeps over ~14 m, so neighbouring views
    # overlap heavily. The session's 0.9 / 0.1 split would leave ~1 rendered test frame per sensor
    # here, so this profile overrides both (user's choice 2026-10-27; profile_split_fractions):
    window_start_seconds: 52
    window_seconds: 15
    # 80/20: with the sessions' shared_interleaved split, every 1/(1 - 0.8) = 5th sweep (and the
    # camera frame nearest it) is held out: ~30 of ~150 frames per sensor (T71).
    # Passed to the dataparser as --train-split-fraction-override (T27).
    train_fraction: 0.8
    # Render an evenly spaced 20% of the held-out instants: ~6 test frames each for camera and
    # lidar; the other ~24 held-out frames per sensor are guard (T72).
    test_render_fraction: 0.2
    # middle_blocks only (unused with shared_interleaved): the central 20% of each T60 test block.
    test_block_core_fraction: 0.2
    # ~120 training frames (80% of ~150) x ~25 visits each = 3000 iterations (one image per iteration):
    # enough for a recognisable fit, a tenth of SplatAD's stock 30001.
    max_num_iterations: &smoke_iterations 3000
    # At least 50 whole-stretch evals per run (the user's minimum, 2026-10-26). submit_run.py derives
    # the eval interval k = (N-1)//50 = 59 (T63) and exports it as --steps-per-eval-all-images.
    minimum_eval_points: 50
    # 3000 / 1000 = 3 checkpoints, so a kill mid-run still leaves something to render.
    steps_per_save: &smoke_save_interval 1000
    # ns-train --machine.seed (python/numpy/torch RNGs). 42 = nerfstudio's MachineConfig default,
    # so earlier smoke runs used the same value; set here so every run records it. It does not
    # make training bit-exact (float-atomic gradient sums in gsplat/SplatAD and tcnn backward).
    seed: 42
    # Conservative cap, far under the 5-day limit, for 3k iterations plus loading and the render.
    # Refine from the measured train/render timings in job_info.txt and `sacct` Elapsed.
    time_limit: &smoke_time_limit "0-02:00:00"
    # Render only the held-out views (the T72 render subset of the held-out instants): they expose wrong geometry
    # that training views can hide by memorising, and training views are not re-rendered, which
    # keeps the data copied back to the Mac small (user's choice 2026-10-26).
    render_pose_source: test
    # Full resolution: only ~150 frames, and pixel-level misalignment is what we look for.
    render_downscale_factor: 1
  smoke_a4500:
    # The smoke profile unchanged (YAML merge of every key above), trained on an RTX A4500 (sm_86;
    # see `gres` above): user's choice 2026-10-27, the first training run on an A4500. ~120 training
    # images stay under neurad's 500-image limit for GPU caching, so the image cache
    # (~120 x 2055 x 1541 x 3 B uint8 = ~1.1 GB) is on the GPU, not in the node's smaller RAM.
    # Its peak GPU memory and RSS tell whether full runs could fit an A4500 too.
    <<: *smoke_profile
    gres: gpu:rtx_a4500:1
  smoke_a4500_scene_split: &smoke_scene_split_profile
    # smoke_a4500 with the May / June Scene A split instead of the smoke's 80/20 override (user's
    # choice 2026-11-01): the same f and r as configs/sessions/*.yaml split:, so the smoke tests the
    # exact hold-out the full runs use. On the ~150-frame window that is every 1/(1 - 0.9) = 10th sweep
    # held out (~15 per sensor), of which ceil(15 x 0.1) = 2 per sensor are rendered and ~13 are guard
    # (T71, T72). The eval during training still uses all ~15 held-out frames (T65).
    # The anchor lets the smoke_a4500_scene_split_radar_* profiles reuse every setting.
    <<: *smoke_profile
    gres: gpu:rtx_a4500:1
    # Same value as configs/sessions/may_short_grass.yaml split.train_fraction.
    train_fraction: 0.9
    # Same value as configs/sessions/may_short_grass.yaml split.test_render_fraction.
    test_render_fraction: 0.1
  smoke_a4500_same_node:
    # smoke_a4500 pinned to one node (user's request 2026-10-29): a diagnostic pair that separates
    # run-to-run noise (atomicAdd order) from node-to-node differences. Never use it for real runs:
    # reproducibility must hold across nodes. One GPU per node, so a pair runs one after the other.
    <<: *smoke_profile
    gres: gpu:rtx_a4500:1
    nodelist: [gpunode21]
  may_scene_a: &may_core_profile
    # Goal: the full May Scene A model (CLAUDE.md scope: chunks 7-9 of may_short_grass, low grass),
    # trained with stock SplatAD and checked on the held-out instants (the sessions' split.method).
    # No window_start_seconds / window_seconds: the whole extracted recording (~241 s), since the
    # session config already cuts it to Scene A (start/end fraction 0.0 / 1.0).
    # 20001 (last step 20000), not SplatAD's stock 30001: user's choice 2026-10-27 from the first full
    # May run's overfitting curves, where the whole-stretch test metrics barely move after step 20000
    # (step 20400 vs 30000: PSNR 12.69 / 13.01, SSIM 0.437 / 0.440, LPIPS 0.798 / 0.782, depth median L2
    # 0.111 / 0.113, chamfer 2.23 / 2.10, ray drop 0.817 / 0.818). Only the outlier-sensitive mean
    # relative depth error kept falling (8.2 -> 4.7). The learning-rate schedules keep their stock
    # max_steps (30000), so this run is the stock recipe stopped at step 20000, the state measured.
    # ~2160 training camera frames x ~9 visits each (one image per iteration).
    max_num_iterations: 20001
    # At least 50 whole-stretch evals per run (the user's minimum, 2026-10-26). submit_run.py derives
    # the eval interval k = (N-1)//50 = 400 (T63) and exports it as --steps-per-eval-all-images.
    minimum_eval_points: 50
    # ~10 checkpoints over the run; at the full May run's 0.49 s/iteration (14717 s / 30001) that is
    # one every ~16 min, so a kill at the time limit loses little.
    steps_per_save: 2000
    # Same seed as the smoke and as June B / R, so the three runs differ only in their data/method.
    seed: 42
    # The full May run trained 30001 iterations in 14717 s (~4.1 h, evals included) on an A6000, so
    # 20001 take ~2.7 h; the after-training render took ~9 min. The radar init + loss arm (job 249567)
    # was slower and hit a 6 h limit at step 17990 of 20001, i.e. ~6 h * 20001 / 17990 = 6.67 h of
    # training plus the ~9 min render = ~6.8 h. With radar_runtime_budget.headroom_factor (2.0) that
    # is ~13.6 h; rounded up to 14 h, far under the 5-day limit. The limit is only a cap (a run
    # ends when training and the render end), and it is shared by all May variants because a radar
    # profile must equal its stock profile except for the radar keys
    # (tests/unit/test_radar_variant_profiles.py).
    time_limit: "0-14:00:00"
    # Render only the test frames (the T72 render subset of the T71 held-out instants), for the held-out
    # metrics in renders/test/lidar_metrics.json and for viewing. Training views are not
    # re-rendered, so far less is copied back to the Mac (user's choice 2026-10-26).
    render_pose_source: test
    # Full resolution, as the smoke: pixel-level misalignment and trunk detail are what we look at.
    render_downscale_factor: 1
  june_scene_a: &june_core_profile
    train_lidar_only: true
    # June Scene A core B: lidar-only training with camera-painted initialization.
    # Older runs of this profile used photometric loss and are B+cam, not this core B.
    # The iteration budget below still matches May; the reference split is unchanged.
    # Whole extracted recording (~216 s): the session config already cuts it to Scene A.
    # As May: 20001 iterations (the May curves converge by step 20000; schedules unchanged);
    # ~1940 training camera frames x ~10 visits each.
    max_num_iterations: 20001
    # At least 50 whole-stretch evals per run (the user's minimum, 2026-10-26). submit_run.py derives
    # the eval interval k = (N-1)//50 = 400 (T63) and exports it as --steps-per-eval-all-images.
    minimum_eval_points: 50
    # As May: ~10 checkpoints.
    steps_per_save: 2000
    # Same seed as May (and as the later lidar-only B and R runs).
    seed: 42
    # As May: same iteration count on a slightly smaller recording (2153 vs 2401 camera frames),
    # so May's ~2.7 h (measured, scaled to 20001) is an upper bound; 6 h leaves ~2x headroom.
    time_limit: &june_core_time_limit "0-06:00:00"
    # As May: render only the T72 render subset (~22 of June's ~216 held-out sweeps, and the camera frames nearest them).
    render_pose_source: test
    # As May: full resolution.
    render_downscale_factor: 1
  smoke_a4500_june: &june_smoke_profile
    # Same short window as the existing smoke, with the June core's lidar-only
    # objective and session split. A4500 is already approved for smoke runs.
    <<: *smoke_profile
    gres: gpu:rtx_a4500:1
    train_lidar_only: true
    train_fraction: 0.9
    test_render_fraction: 0.1
  june_loss_only:
    <<: *june_core_profile
    radar_loss_only: true
  smoke_a4500_june_loss_only:
    <<: *june_smoke_profile
    radar_loss_only: true
  june_loss_only_smoke:
    # Full canonical June window: its longer motion trace permits clock calibration.
    # Shorten optimization only. Full-data caches require the default A6000 allocation.
    <<: *june_core_profile
    max_num_iterations: *smoke_iterations
    steps_per_save: *smoke_save_interval
    # The measured full B run took 3 h 4 min including its 50 full-scene evals.
    # This smoke keeps those evals, so reuse the full allocation's time budget.
    time_limit: *june_core_time_limit
    radar_loss_only: true
    radar_anchor_profile: june_loss_only

  # ---- Radar variants (three variants x two sessions). Each profile is the month's core profile
  # (may_scene_a / june_scene_a) plus the two radar keys, so a variant run differs from stock SplatAD
  # only by its method and data. radar_variant: init = stock + radar seed Gaussians
  # (splatad-radar-init); init_loss = the same + the radar opacity loss (splatad-radar-init-lidar).
  # radar_anchor_profile names the profile whose artifact (<dataset>/radar_inputs/<profile>/) is read;
  # it defaults to the profile itself. One artifact per month serves init and init_loss, because both
  # share the core's split settings (enforced by require_radar_anchor_split_matches in submit_run.py,
  # called by gates, submit and scripts/07: a profile whose split differs from its anchor's is refused).
  # May trains with the camera loss on; June is lidar-only (train_lidar_only comes from the core).
  may_scene_a_radar_init:
    <<: *may_core_profile
    radar_variant: init
  may_scene_a_radar_init_loss:
    <<: *may_core_profile
    radar_variant: init_loss
    radar_anchor_profile: may_scene_a_radar_init
  june_scene_a_radar_init:
    <<: *june_core_profile
    radar_variant: init
  june_scene_a_radar_init_loss:
    <<: *june_core_profile
    radar_variant: init_loss
    radar_anchor_profile: june_scene_a_radar_init

  # ---- Radar smokes: the month's full-window core with the smoke profile's iteration and save
  # settings (anchors reused), reading the month's full-run init artifact so no separate artifact
  # is built for a smoke.
  # The smokes keep the core's 6 h time_limit instead of the smoke profile's 2 h, for the same reason as
  # june_loss_only_smoke: they keep the evals of the full run on the full-window dataset, so the short
  # iteration count does not shorten the job in proportion.
  may_radar_init_smoke:
    <<: *may_core_profile
    max_num_iterations: *smoke_iterations
    steps_per_save: *smoke_save_interval
    radar_variant: init
    radar_anchor_profile: may_scene_a_radar_init
  may_radar_init_loss_smoke:
    <<: *may_core_profile
    max_num_iterations: *smoke_iterations
    steps_per_save: *smoke_save_interval
    radar_variant: init_loss
    radar_anchor_profile: may_scene_a_radar_init
  # The radar smokes on the may_chunks0_1_smoke dataset (May chunks 0-1; user's choice 2026-11-15):
  # smoke_a4500_scene_split unchanged (YAML merge: same window, steps, seed, split, GPU type) plus the
  # radar variant, so each is compared with the stock run of that profile on the same frames. Unlike the
  # full-window radar smokes around them, they use the 15 s smoke window, the smoke's 2 h time_limit and
  # their own artifact: both read the one built for the init profile
  # (<dataset>/radar_inputs/smoke_a4500_scene_split_radar_init).
  smoke_a4500_scene_split_radar_init:
    <<: *smoke_scene_split_profile
    radar_variant: init
  smoke_a4500_scene_split_radar_init_loss:
    <<: *smoke_scene_split_profile
    radar_variant: init_loss
    radar_anchor_profile: smoke_a4500_scene_split_radar_init
  june_radar_init_smoke:
    <<: *june_core_profile
    max_num_iterations: *smoke_iterations
    steps_per_save: *smoke_save_interval
    radar_variant: init
    radar_anchor_profile: june_scene_a_radar_init
  june_radar_init_loss_smoke:
    <<: *june_core_profile
    max_num_iterations: *smoke_iterations
    steps_per_save: *smoke_save_interval
    radar_variant: init_loss
    radar_anchor_profile: june_scene_a_radar_init
